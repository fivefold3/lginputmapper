name: Build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: mlugg/setup-zig@v2
        with:
          version: 0.14.1
      - run: npm ci
      - run: npm run build
      - run: npm run package
      - uses: actions/upload-artifact@v4
        with:
          name: ipk
          path: dist/*.ipk
      - name: Release notes
        if: startsWith(github.ref, 'refs/tags/')
        run: sh scripts/release-notes.sh "$GITHUB_REF_NAME" > release-notes.md
      - name: Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.ipk
          body_path: release-notes.md
